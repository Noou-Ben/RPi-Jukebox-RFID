pin_factory:
  type: rpigpio.RPiGPIOFactory
input_devices:
  VolumeRotator:
    # KY-040 style rotary encoder, rotation = volume up/down
    type: RotaryEncoder
    kwargs:
      a: 5
      b: 6
    actions:
      on_rotate_clockwise:
        alias: change_volume
        args: 5
      on_rotate_counter_clockwise:
        alias: change_volume
        args: -5
  VolumeRotatorButton:
    # The rotary encoder's own push-button (pressing the knob)
    type: Button
    kwargs:
      pin: 13
    actions:
      on_press:
        alias: toggle
  PrevButton:
    type: Button
    kwargs:
      pin: 12
    actions:
      on_press:
        alias: prev_song
  NextButton:
    type: Button
    kwargs:
      pin: 20
    actions:
      on_press:
        alias: next_song
